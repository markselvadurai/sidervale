<div #mapContainer class="map-container"></div>
<button
  type="button"
  class="overlay-toggle"
  [class.overlay-toggle--on]="overlayOn()"
  [attr.aria-pressed]="overlayOn()"
  (click)="overlayOn.set(!overlayOn())"
>
  <span class="overlay-toggle__dot" aria-hidden="true"></span>
  Light pollution
</button>
<button
  type="button"
  class="list-toggle"
  [class.list-toggle--on]="listOpen()"
  [attr.aria-pressed]="listOpen()"
  (click)="listOpen.set(!listOpen())"
>
  Ranked list
</button>
@if (listOpen()) {
  <div class="rank-panel">
    <app-ranked-list [sites]="sitesInView()" />
  </div>
}
<div class="marker-filter" role="group" aria-label="Which sites to show">
  @for (opt of filterOptions; track opt.value) {
    <button
      type="button"
      class="marker-filter__opt"
      [class.marker-filter__opt--on]="markerFilter() === opt.value"
      [attr.aria-pressed]="markerFilter() === opt.value"
      (click)="markerFilter.set(opt.value)"
    >
      {{ opt.label }}
    </button>
  }
</div>
@if (sitesService.datasetState() === 'failed') {
  <div class="dataset-error">Site data failed to load — refresh to retry</div>
}
<app-site-panel />
