<div #mapContainer class="map-container"></div>
<button
  type="button"
  [class]="'overlay-toggle ' + (overlayOn() ? 'overlay-toggle--on' : 'overlay-toggle--off')"
  (click)="overlayOn.set(!overlayOn())"
>
  light-pollution overlay{{ overlayOn() ? ' Toggle On' : ' Toggle Off' }} ⬒
</button>
@if (sitesService.datasetState() === 'failed') {
  <div class="dataset-error">Site data failed to load — refresh to retry</div>
}
<app-site-panel />
