name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:tools
      - run: npm run typecheck:tools
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    strategy:
      # a UTC-only runner hides day-seam bugs; Toronto evenings cross the UTC date line
      matrix:
        tz: [UTC, America/Toronto]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
